<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Task Management Application</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>

            <h1>Task Manager</h1>

            <p>
                Organize your tasks and stay productive
            </p>

        </header>


        <!-- Add Task Section -->
        <div class="add-task">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button id="addTaskButton">
                Add Task
            </button>

        </div>


        <!-- Task Statistics -->
        <div class="stats">

            <div class="stat-card">

                <h3 id="totalTasks">
                    0
                </h3>

                <p>Total Tasks</p>

            </div>


            <div class="stat-card">

                <h3 id="pendingTasks">
                    0
                </h3>

                <p>Pending</p>

            </div>


            <div class="stat-card">

                <h3 id="completedTasks">
                    0
                </h3>

                <p>Completed</p>

            </div>

        </div>


        <!-- Filter Buttons -->
        <div class="filters">

            <button
                class="filter active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter"
                data-filter="pending"
            >
                Pending
            </button>

            <button
                class="filter"
                data-filter="completed"
            >
                Completed
            </button>

        </div>


        <!-- Task List -->
        <div id="taskList">

            <!-- Tasks will be added here using JavaScript -->

        </div>


        <!-- Empty Message -->
        <p id="emptyMessage">
            No tasks available.
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
